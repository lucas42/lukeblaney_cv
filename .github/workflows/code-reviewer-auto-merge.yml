name: Auto-merge on code reviewer approval

on:
  pull_request_review:
    types:
      - submitted
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  reusable:
    uses: lucas42/.github/.github/workflows/reusable-code-reviewer-auto-merge.yml@4a9dc7555d66e7f70a436aeb1c54349ca62570c4 # v1.25.0
    secrets:
      LUCOS_CI_APP_ID: ${{ secrets.LUCOS_CI_APP_ID }}
      LUCOS_CI_PRIVATE_KEY: ${{ secrets.LUCOS_CI_PRIVATE_KEY }}
